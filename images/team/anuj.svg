<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1d" />
      <stop offset="50%" stop-color="#111936" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7cff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(74, 124, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(74, 124, 255, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#techGrid)" />

  <!-- Glow circle -->
  <circle cx="280" cy="320" r="160" fill="url(#centerGlow)" />

  <!-- Avatar Outer Ring -->
  <circle cx="280" cy="320" r="100" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="280" cy="320" r="92" fill="#0d142b" stroke="rgba(74, 124, 255, 0.3)" stroke-width="2" />

  <!-- Initials Text -->
  <text x="280" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">AC</text>

  <!-- Member Label -->
  <text x="280" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#88a0db" text-anchor="middle" letter-spacing="3" text-transform="uppercase">NEXCELL MEMBER</text>
  <text x="280" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#586e9e" text-anchor="middle">Photo updating soon</text>
</svg>
